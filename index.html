<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Massine Amakhtari — Backend Engineer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Massine Amakhtari — software engineering student building reliable APIs, event-driven systems, and cloud-native backends." />
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  // Apply theme before paint to avoid a flash. Light is default; localStorage wins.
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var theme = (stored === 'light' || stored === 'dark') ? stored : 'light';
      var html = document.documentElement;
      html.setAttribute('data-theme', theme);
      html.style.colorScheme = theme;
      if (theme === 'dark') html.classList.add('dark');
    } catch (_) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
